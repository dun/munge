name: build

on:
  pull_request:
  push:
    branches:
      - build

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            crypto: openssl
            opts: "--disable-debug"
            cc: gcc
            cflags: "-O2 -Wall -Wextra"
          - os: ubuntu-latest
            crypto: openssl
            opts: "--enable-debug"
            cc: clang
            cflags: "-O2"
          - os: ubuntu-latest
            crypto: libgcrypt
            opts: "--enable-debug"
            cc: gcc
            cflags: "-O2"
          - os: ubuntu-latest
            crypto: libgcrypt
            opts: "--disable-debug"
            cc: clang
            cflags: "-O2 -Wall -Wextra"
          - os: ubuntu-26.04-arm
            crypto: openssl
            opts: "--enable-debug"
            cc: gcc
            cflags: "-O2"
          - os: ubuntu-26.04-arm
            crypto: openssl
            opts: "--disable-debug"
            cc: clang
            cflags: "-O2 -Wall -Wextra"
          - os: ubuntu-26.04-arm
            crypto: libgcrypt
            opts: "--disable-debug"
            cc: gcc
            cflags: "-O2 -Wall -Wextra"
          - os: ubuntu-26.04-arm
            crypto: libgcrypt
            opts: "--enable-debug"
            cc: clang
            cflags: "-O2"
          - os: macos-latest
            crypto: openssl
            opts: "--disable-debug"
            cc: clang
            cflags: "-O2 -Wall -Wextra"
          - os: macos-latest
            crypto: openssl
            opts: "--enable-debug"
            cc: clang
            cflags: "-O2"
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - name: Get OS version
        run: |
          case "${{ matrix.os }}" in
            ubuntu*)
              cat /etc/os-release ;;
            macos*)
              sw_vers ;;
          esac
      - name: Get uname
        run: uname -a
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deps
        run: |
          case "${{ matrix.os }}" in
            ubuntu*)
              sudo apt-get update
              sudo apt-get install -y autoconf automake libtool \
                libgcrypt20-dev libssl-dev zlib1g-dev libbz2-dev faketime ;;
            macos*)
              brew install autoconf automake libtool ;;
          esac
      - name: Bootstrap
        run: ./bootstrap
      - name: Configure
        run: |
          ./configure --with-crypto-lib="${{ matrix.crypto }}" \
            ${{ matrix.opts }} CC="${{ matrix.cc }}"
      - name: Get config.log
        run: cat config.log
      - name: Get config.h
        run: cat config.h
      - name: Build
        run: make V=1 CFLAGS="${{ matrix.cflags }} -Werror"
      - name: Test
        run: |
          case "${{ matrix.os }}" in
            macos*)
              tmp="/private/tmp" ;;
          esac
          make check V=1 CFLAGS="${{ matrix.cflags }} -Werror" \
            TMPDIR="${tmp:-/tmp}" root="${tmp:-/tmp}/munge-test-$$" \
            chain_lint=t verbose=t VERBOSE=t
      - name: Get test-suite.log
        if: ${{ failure() }}
        run: find . -type f -name "test-suite.log" -execdir cat {} \;
